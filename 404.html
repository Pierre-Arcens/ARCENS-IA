<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable | Arcens IA</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/manrope-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/manrope-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/manrope-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/manrope-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 800; font-display: swap; src: url(/fonts/manrope-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/space-grotesk-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/space-grotesk-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/space-grotesk-latin.woff2) format('woff2'); }
  :root { --bg:#f7f9f8; --text:#10181f; --soft:#2e3e48; --accent:#1d4e75; --on:#f7f9f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10181f; --text:#eef1ef; --soft:#c3cbc8; --accent:#5b9bd5; --on:#10181f; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:"Manrope","Segoe UI",Arial,sans-serif; line-height:1.6; padding:1.5rem; }
  main { max-width:34rem; }
  h1 { font-family:"Space Grotesk","Segoe UI",Arial,sans-serif; font-size:clamp(2rem,6vw,3rem); line-height:1.1; margin:0 0 1rem; }
  p { color:var(--soft); margin:0 0 1.75rem; }
  a.btn { display:inline-block; background:var(--accent); color:var(--on); font-weight:700; text-decoration:none; padding:0.75rem 1.4rem; border-radius:2px; }
  a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>
  <p>Cette adresse n'existe pas ou a été déplacée. Retournez à l'accueil pour découvrir les prestations d'Arcens IA, conseil en intelligence artificielle pour TPE et PME.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</main>
</body>
</html>
